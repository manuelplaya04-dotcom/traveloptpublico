# Blueprint de Render: el motor en el plan gratuito (se duerme tras 15 min sin uso; la web lo despierta con /api/warmup).
# Producción sin n8n: el motor orquesta en proceso (decisión del 2026-11-01, ver project_guidelines.md).
# Los secretos no viven acá: ENGINE_API_KEY la genera Render y DATABASE_URL se pega en el panel al crear el Blueprint.
services:
  - type: web
    name: travelopt-engine
    runtime: docker
    plan: free
    region: virginia            # cerca de Supabase (us-east-1) y de Vercel (iad1)
    rootDir: engine
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:                # solo se reconstruye si cambia el motor (no gasta build ni reinicia por cambios de la web)
      paths:
        - engine/**
    envVars:
      - key: ENV
        value: production
      - key: ORCHESTRATOR
        value: inprocess
      - key: DEFAULT_MODE
        value: hybrid           # precios reales de SerpApi si hay clave; sin clave, datos de ejemplo
      - key: ENGINE_API_KEY
        generateValue: true     # aleatoria de 256 bits; se copia al gestor y a Vercel desde el panel de Render
      - key: DATABASE_URL
        sync: false             # Supabase → Connect → Session pooler, con ?sslmode=require
      - key: SERPAPI_API_KEY
        sync: false             # vuelos y hoteles reales; solo se usan con DEFAULT_MODE=hybrid (o live)
      - key: ALERT_WEBHOOK_URL
        sync: false             # opcional: alertas a Discord/Slack/Telegram (la URL es un secreto)
      - key: TICKETMASTER_API_KEY
        sync: false             # eventos en la ciudad (opcional); sin clave, solo Google Events pre-cargado
      - key: SERPAPI_QUOTA_RESERVE
        value: "20"             # búsquedas que se protegen; al llegar, el motor sirve precios guardados (modo histórico)
      - key: MAX_SERPAPI_QUERIES_PER_RUN
        value: "6"              # presupuesto de búsquedas pagas por consulta; si no entra, se acota el plan
